site_name: Deep Anomaly Detector
site_description: Unsupervised anomaly detection on time-series sensor data using Isolation Forest and autoencoders.
repo_url: https://github.com/kcabrera83/deep-anomaly-detector
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
